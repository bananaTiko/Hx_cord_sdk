name: Release

# Creates a version on demand: run this workflow from the Actions tab (or with
# `gh workflow run release.yml -f version=1.2.0`). It bumps haxelib.json,
# verifies the library, tags the commit and publishes a GitHub release with the
# haxelib zip attached.
#
# Publishing to lib.haxe.org is opt-in: add a repository secret named
# HAXELIB_PASSWORD (your haxelib API key) and the workflow also submits the
# release with `haxelib submit`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, semver without a leading v (e.g. 1.2.0). Leave empty to bump the minor version automatically."
        required: false
        type: string
      bump:
        description: "Used when version is empty: which part of the current version to increment."
        required: false
        default: minor
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        required: false
        default: false
        type: boolean
      publish_to_haxelib:
        description: "Also submit to lib.haxe.org (needs the HAXELIB_PASSWORD secret)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Haxe and Neko
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: "4.3.7"

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(python3 -c "import json; print(json.load(open('haxelib.json'))['version'])")
          version="$INPUT_VERSION"

          if [[ -z "$version" ]]; then
            IFS=. read -r major minor patch <<< "$current"
            case "$INPUT_BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              *) echo "::error::Unknown bump: $INPUT_BUMP" ; exit 1 ;;
            esac
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $version"

      - name: Bump haxelib.json
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          with open("haxelib.json") as handle:
              data = json.load(handle)
          data["version"] = version
          data["releasenote"] = os.environ.get("RELEASE_NOTE") or data.get("releasenote", "")
          with open("haxelib.json", "w") as handle:
              json.dump(data, handle, indent="\t", ensure_ascii=False)
              handle.write("\n")
          PY
          grep -n '"version"' haxelib.json

      - name: Verify before tagging
        run: |
          # Same prerequisites as ci.yml: the shim smoke test needs a C++20 compiler.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++
          haxelib dev hxcord "$GITHUB_WORKSPACE"
          haxelib install hxcpp --quiet
          haxelib install flixel --quiet
          # --all also compile-checks every framework adapter, so the adapters'
          # haxelibs have to be present here too (Kha is cloned by the script).
          haxelib install openfl --quiet
          haxelib install lime --quiet
          haxelib install heaps --quiet
          # HashLink publishes Windows binaries only, so build it from source.
          git clone --depth 1 --branch 1.15 \
            https://github.com/HaxeFoundation/hashlink "$RUNNER_TEMP/hashlink-src"
          make -C "$RUNNER_TEMP/hashlink-src" hl -j"$(nproc)" >/dev/null
          mkdir -p "$HOME/hashlink/bin" "$HOME/hashlink/include"
          cp "$RUNNER_TEMP/hashlink-src/hl" "$HOME/hashlink/bin/"
          cp "$RUNNER_TEMP/hashlink-src"/libhl.so* "$HOME/hashlink/bin/"
          cp -r "$RUNNER_TEMP/hashlink-src/include/." "$HOME/hashlink/include/"
          export HL_ROOT="$HOME/hashlink"
          export LD_LIBRARY_PATH="$HOME/hashlink/bin"
          ./scripts/verify.sh --all

      - name: Package the haxelib
        run: |
          set -euo pipefail
          mkdir -p dist
          # extraParams.hxml ships with the library: haxelib applies it to builds
          # that use `-lib hxcord`, and it is what carries -D HXCPP_NO_CPP11.
          zip -r "dist/hxcord-${{ steps.version.outputs.value }}.zip" \
            haxelib.json extraParams.hxml README.md LICENSE src native scripts samples \
            -x "*__pycache__*" >/dev/null
          sha256sum dist/*.zip > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Commit and tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haxelib.json
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$PRERELEASE" == "true" ]]; then prerelease_flag="--prerelease"; fi
          gh release create "v$VERSION" \
            --title "HXCord $VERSION" \
            --notes "HXCord $VERSION. Attach this zip with \`haxelib install hxcord-$VERSION.zip\` (or via lib.haxe.org once published)." \
            --target "${{ steps.tag.outputs.sha }}" \
            $prerelease_flag \
            "dist/hxcord-$VERSION.zip" dist/SHA256SUMS

      - name: Publish to lib.haxe.org
        if: ${{ inputs.publish_to_haxelib }}
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "$HAXELIB_PASSWORD" ]]; then
            echo "::error::publish_to_haxelib was requested but the HAXELIB_PASSWORD secret is not set"
            exit 1
          fi
          # hxcord has no name conflicts on lib.haxe.org; the dev entry created
          # during verification is replaced by the submitted archive.
          haxelib submit "dist/hxcord-$VERSION.zip"
