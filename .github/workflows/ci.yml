name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Linux, Haxe ${{ matrix.haxe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.3.7 is what the library is developed against; the snapshot catches
        # breakage in upcoming compilers early. Flixel needs a matching version,
        # so both are installed from the same Haxe release.
        haxe: ["4.3.7"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Haxe and Neko
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}

      - name: Register the haxelib
        run: |
          haxelib dev hxcord "$GITHUB_WORKSPACE"
          haxelib install hxcpp --quiet
          haxelib install flixel --quiet
          # Framework adapters are compile-checked against the real haxelibs.
          haxelib install openfl --quiet
          haxelib install lime --quiet
          haxelib install heaps --quiet

      - name: Cache HashLink
        id: hashlink
        uses: actions/cache@v4
        with:
          path: ~/hashlink
          key: hashlink-1.15-${{ runner.os }}

      - name: Build HashLink
        # HashLink only publishes Windows binaries, so Linux builds it from
        # source (about a minute; cached between runs).
        if: steps.hashlink.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.15 \
            https://github.com/HaxeFoundation/hashlink "$RUNNER_TEMP/hashlink-src"
          make -C "$RUNNER_TEMP/hashlink-src" hl -j"$(nproc)" >/dev/null
          mkdir -p "$HOME/hashlink/bin" "$HOME/hashlink/include"
          cp "$RUNNER_TEMP/hashlink-src/hl" "$HOME/hashlink/bin/"
          cp "$RUNNER_TEMP/hashlink-src"/libhl.so* "$HOME/hashlink/bin/"
          cp -r "$RUNNER_TEMP/hashlink-src/include/." "$HOME/hashlink/include/"

      - name: Use HashLink
        run: |
          echo "HL_ROOT=$HOME/hashlink" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/hashlink/bin" >> "$GITHUB_ENV"

      - name: Fetch the Discord Social SDK headers for the signature check
        # The SDK binaries are per-application and not redistributable. The
        # Godot binding vendors the public headers, which is enough to
        # compile-check the shim against the real API.
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/thiagola92/discord-social-sdk.git "$RUNNER_TEMP/sdk"
          echo "DISCORD_SDK_INCLUDE=$RUNNER_TEMP/sdk/sdk/include" >> "$GITHUB_ENV"

      - name: Install a C++20 compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++

      # Kha is no longer on haxelib; scripts/verify.sh clones its sources into
      # build/kha for the Kha adapter check.
      - name: Cache the Kha sources
        # Otherwise every run re-clones Kha just for one compile check.
        uses: actions/cache@v4
        with:
          path: build/kha
          key: kha-sources-v1

      - name: Verify everything
        run: ./scripts/verify.sh --all

  docs:
    name: Rename and docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No stray references to the old package
        run: |
          if grep -rn "package discord\.social" src --include=*.hx \
              | grep -v "src/discord/social/"; then
            echo "::error::Only the compatibility aliases may use the discord.social package"
            exit 1
          fi

      - name: Compatibility aliases stay in sync
        # Every public hxcord type needs a discord.social alias, otherwise the
        # "don't break existing code" promise silently rots. The types are
        # discovered from the tree rather than listed by hand, so adding a public
        # type fails here until it is aliased instead of quietly escaping.
        #
        # The framework adapters (src/hxcord/<framework>/) are new API with no 0.2
        # names, so they need no alias; the next step makes sure each one has a
        # compile check instead.
        run: |
          missing=0

          # Root public types: alias must live in src/discord/social/<Name>.hx.
          for file in src/hxcord/*.hx; do
            name=$(basename "$file" .hx)
            alias_file="src/discord/social/$name.hx"
            if ! grep -qE "^typedef $name = hxcord\\.$name;" "$alias_file" 2>/dev/null; then
              echo "::error file=$file::Missing or stale alias in $alias_file"
              missing=1
            fi
          done

          # Internals: portable ones are aliased too. Target-specific ones (they
          # only exist on one target, so no portable alias can be declared) are
          # listed explicitly and skipped.
          target_specific=" BuildCheck CppShimApi DiscordBuild DsClient HashLinkBackend HlShim HlShimApi NativeBackend Shim "
          for file in src/hxcord/internal/*.hx; do
            name=$(basename "$file" .hx)
            case "$target_specific" in *" $name "*) continue ;; esac
            alias_file="src/discord/social/internal/$name.hx"
            if ! grep -qE "^typedef $name = hxcord\\.internal\\.$name;" "$alias_file" 2>/dev/null; then
              echo "::error file=$file::Missing or stale alias in $alias_file"
              missing=1
            fi
          done

          exit $missing

      - name: Every framework adapter is compile-checked
        # Adding an adapter without wiring it into the verifier is how the
        # framework list outgrows its coverage. Each src/hxcord/<id>/HXCord.hx must
        # be imported by a check under test/ *and* named in scripts/verify.sh, so
        # an adapter cannot be added that CI never compiles.
        # `integration` is the framework-neutral facade: it is compiled through the
        # adapters that alias it (Heaps, Kha) and has no per-frame hook of its own.
        run: |
          missing=0
          for file in src/hxcord/*/HXCord.hx; do
            id=$(basename "$(dirname "$file")")
            case "$id" in integration) continue ;; esac

            if ! grep -rq "hxcord\\.$id\\." test --include=*.hx; then
              echo "::error file=$file::No compile check under test/ imports hxcord.$id"
              missing=1
            fi
            if ! grep -qi "$id" scripts/verify.sh; then
              echo "::error file=$file::scripts/verify.sh has no step for the $id adapter"
              missing=1
            fi
          done
          exit $missing

      - name: Release workflow is valid
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/release.yml'))"
